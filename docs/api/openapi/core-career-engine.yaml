components:
  schemas:
    ATSAnalysisRequest:
      properties:
        target_job_title:
          type: string
          maxLength: 150
          minLength: 2
          title: Target Job Title
        target_job_description:
          type: string
          maxLength: 25000
          minLength: 10
          title: Target Job Description
      type: object
      required:
      - target_job_title
      - target_job_description
      title: ATSAnalysisRequest
      description: Request to score ATS keyword coverage and bullet strength against
        a target job.
    ATSAnalysisResponse:
      properties:
        analysis_id:
          type: string
          title: Analysis Id
        resume_id:
          type: string
          title: Resume Id
        version_id:
          type: string
          title: Version Id
        target_job_title:
          type: string
          title: Target Job Title
        coverage_score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Coverage Score
          description: Fraction of top JD keywords found in resume text
        matched_keywords:
          items:
            type: string
          type: array
          title: Matched Keywords
        missing_keywords:
          items:
            type: string
          type: array
          title: Missing Keywords
        bullet_impact_score:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Bullet Impact Score
          description: Percentage of quantified/impactful bullets
        bullet_impact_analysis:
          additionalProperties: true
          type: object
          title: Bullet Impact Analysis
        actionable_suggestions:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Actionable Suggestions
          description: Suggestions strictly grounded in document evidence; never fabricates
            facts
        formatting_observations:
          items:
            type: string
          type: array
          title: Formatting Observations
        methodology_and_limitations:
          type: string
          title: Methodology And Limitations
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - analysis_id
      - resume_id
      - version_id
      - target_job_title
      - coverage_score
      - matched_keywords
      - missing_keywords
      - bullet_impact_score
      - bullet_impact_analysis
      - actionable_suggestions
      - formatting_observations
      - methodology_and_limitations
      - created_at
      title: ATSAnalysisResponse
      description: Transparent ATS keyword coverage, bullet impact, and non-fabricating
        advice.
    AccountDeletionRequest:
      properties:
        confirmation:
          type: string
          title: Confirmation
          description: Must explicitly match 'DELETE MY ACCOUNT'
        reason:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Reason
      type: object
      required:
      - confirmation
      title: AccountDeletionRequest
    AccountDeletionResponse:
      properties:
        deletion_id:
          type: string
          title: Deletion Id
        status:
          $ref: '#/components/schemas/DeletionStatus'
        scheduled_deletion_at:
          type: string
          format: date-time
          title: Scheduled Deletion At
        service_status:
          additionalProperties:
            type: string
          type: object
          title: Service Status
          description: Tracks deletion acknowledgment across independent services
            (leadhunter, startup_intel).
        message:
          type: string
          title: Message
      type: object
      required:
      - deletion_id
      - status
      - scheduled_deletion_at
      - message
      title: AccountDeletionResponse
    AccountStatus:
      type: string
      enum:
      - PENDING_VERIFICATION
      - ACTIVE
      - SUSPENDED
      - DELETION_PENDING
      - DELETED
      title: AccountStatus
      description: Lifecycle states of a user account.
    AuthType:
      type: string
      enum:
      - NONE_PUBLIC
      - API_KEY
      - BEARER_TOKEN
      - OAUTH2
      title: AuthType
      description: Authentication requirement for the source.
    Body_upload_new_version_api_v1_resumes__resume_id__versions_post:
