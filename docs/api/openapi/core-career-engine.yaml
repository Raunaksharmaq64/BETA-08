openapi: 3.1.0
info:
  title: RIGHT FIT Core Career Engine
  description: Central career intelligence orchestration, candidate identity, ATS
    aggregation, and contract gateway.
  version: 1.0.0
paths:
  /health/live:
    get:
      tags:
      - Health & Readiness
      summary: Liveness Probe
      description: 'Liveness probe confirming the application process is running.

        Does NOT check external dependencies (DB/Redis) to avoid cascading container
        restarts.'
      operationId: liveness_probe_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /health/ready:
    get:
      tags:
      - Health & Readiness
      summary: Readiness Probe
      description: 'Readiness probe confirming the application can accept user traffic.

        Checks connectivity to critical dependencies.'
      operationId: readiness_probe_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /api/v1/health/live:
    get:
      tags:
      - Health & Readiness
      summary: Liveness Probe
      description: 'Liveness probe confirming the application process is running.

        Does NOT check external dependencies (DB/Redis) to avoid cascading container
        restarts.'
      operationId: liveness_probe_api_v1_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /api/v1/health/ready:
    get:
      tags:
      - Health & Readiness
      summary: Readiness Probe
      description: 'Readiness probe confirming the application can accept user traffic.

        Checks connectivity to critical dependencies.'
      operationId: readiness_probe_api_v1_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /api/v1/auth/register:
    post:
      tags:
      - Authentication & Identity
      summary: Register
      description: Registers a candidate user and sets up initial profile and privacy
        records.
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_UserResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication & Identity
      summary: Login
      description: Authenticates user, issues access & refresh tokens, and attaches
        secure HttpOnly cookie.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_TokenResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication & Identity
      summary: Logout
      description: Terminates active session and clears authentication cookies.
      operationId: logout_api_v1_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_dict_'
      security:
      - HTTPBearer: []
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication & Identity
      summary: Refresh Token
      description: Rotates refresh token and issues renewed access token with replay-attack
        detection.
      operationId: refresh_token_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_TokenResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - Authentication & Identity
      summary: Get Current User Profile
      description: Returns authenticated user identity.
      operationId: get_current_user_profile_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_UserResponse_'
      security:
      - HTTPBearer: []
  /api/v1/auth/change-password:
    post:
      tags:
      - Authentication & Identity
      summary: Change Password
      description: Updates password and revokes all active refresh sessions.
      operationId: change_password_api_v1_auth_change_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_dict_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/auth/forgot-password:
    post:
      tags:
      - Authentication & Identity
      summary: Forgot Password
      description: Initiates password recovery without leaking account existence.
      operationId: forgot_password_api_v1_auth_forgot_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_dict_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/reset-password:
    post:
      tags:
      - Authentication & Identity
      summary: Reset Password
      description: Completes password reset using single-use cryptographic token.
      operationId: reset_password_api_v1_auth_reset_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_dict_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/verify-email:
    post:
      tags:
      - Authentication & Identity
      summary: Verify Email
      description: Verifies candidate email address via single-use token.
      operationId: verify_email_api_v1_auth_verify_email_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_dict_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/resend-verification:
    post:
      tags:
      - Authentication & Identity
      summary: Resend Verification
      description: Resends email verification link with rate limiting.
      operationId: resend_verification_api_v1_auth_resend_verification_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_dict_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/candidate/profile:
    get:
      tags:
      - Candidate Profile & Preferences
      summary: Get Profile
      description: Retrieves authenticated candidate profile including education,
        experience, and skills.
      operationId: get_profile_api_v1_candidate_profile_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_CandidateProfileResponse_'
      security:
      - HTTPBearer: []
    put:
      tags:
      - Candidate Profile & Preferences
      summary: Update Profile
      description: Updates candidate headline, summary, and location.
      operationId: update_profile_api_v1_candidate_profile_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateProfileUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_CandidateProfileResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/candidate/profile/completeness:
    get:
      tags:
      - Candidate Profile & Preferences
      summary: Get Profile Completeness
      description: Calculates profile completeness score and lists missing sections.
      operationId: get_profile_completeness_api_v1_candidate_profile_completeness_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_ProfileCompletenessResponse_'
      security:
      - HTTPBearer: []
  /api/v1/candidate/education:
    post:
      tags:
      - Candidate Profile & Preferences
      summary: Add Education
      description: Adds an education credential with provenance.
      operationId: add_education_api_v1_candidate_education_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EducationCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_EducationResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/candidate/education/{edu_id}:
    delete:
      tags:
      - Candidate Profile & Preferences
      summary: Delete Education
      description: Deletes an education entry with strict ownership check.
      operationId: delete_education_api_v1_candidate_education__edu_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: edu_id
        in: path
        required: true
        schema:
          type: string
          title: Edu Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_dict_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/candidate/experience:
    post:
      tags:
      - Candidate Profile & Preferences
      summary: Add Experience
      description: Adds a professional experience record.
      operationId: add_experience_api_v1_candidate_experience_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperienceCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_ExperienceResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/candidate/experience/{exp_id}:
    delete:
      tags:
      - Candidate Profile & Preferences
      summary: Delete Experience
      description: Deletes an experience entry with strict ownership check.
      operationId: delete_experience_api_v1_candidate_experience__exp_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: exp_id
        in: path
        required: true
        schema:
          type: string
          title: Exp Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_dict_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/candidate/skills:
    post:
      tags:
      - Candidate Profile & Preferences
      summary: Add Skill
      description: Appends a skill to candidate profile.
      operationId: add_skill_api_v1_candidate_skills_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_SkillResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/candidate/skills/{skill_id}:
    delete:
      tags:
      - Candidate Profile & Preferences
      summary: Delete Skill
      description: Deletes a skill entry with strict ownership check.
      operationId: delete_skill_api_v1_candidate_skills__skill_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: skill_id
        in: path
        required: true
        schema:
          type: string
          title: Skill Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_dict_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/candidate/preferences:
    get:
      tags:
      - Candidate Profile & Preferences
      summary: Get Preferences
      description: Retrieves candidate employment and role preferences.
      operationId: get_preferences_api_v1_candidate_preferences_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_CandidatePreferencesResponse_'
      security:
      - HTTPBearer: []
    put:
      tags:
      - Candidate Profile & Preferences
      summary: Update Preferences
      description: Updates candidate employment and role preferences.
      operationId: update_preferences_api_v1_candidate_preferences_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidatePreferencesUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_CandidatePreferencesResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/candidate/privacy:
    get:
      tags:
      - Privacy, Consent & Data Rights
      summary: Get Privacy Settings
      description: Retrieves candidate privacy and visibility preferences.
      operationId: get_privacy_settings_api_v1_candidate_privacy_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_PrivacySettingsResponse_'
      security:
      - HTTPBearer: []
    put:
      tags:
      - Privacy, Consent & Data Rights
      summary: Update Privacy Settings
      description: Updates candidate privacy and visibility preferences.
      operationId: update_privacy_settings_api_v1_candidate_privacy_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacySettingsUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_PrivacySettingsResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/candidate/consents:
    get:
      tags:
      - Privacy, Consent & Data Rights
      summary: List Consents
      description: Lists auditable consent history.
      operationId: list_consents_api_v1_candidate_consents_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_List_ConsentRecordResponse__'
      security:
      - HTTPBearer: []
    post:
      tags:
      - Privacy, Consent & Data Rights
      summary: Grant Consent
      description: Records explicit consent for a processing purpose.
      operationId: grant_consent_api_v1_candidate_consents_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentGrantRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_ConsentRecordResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/candidate/consents/{consent_id}:
    delete:
      tags:
      - Privacy, Consent & Data Rights
      summary: Withdraw Consent
      description: Withdraws an existing consent grant.
      operationId: withdraw_consent_api_v1_candidate_consents__consent_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: consent_id
        in: path
        required: true
        schema:
          type: string
          title: Consent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_ConsentRecordResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/candidate/data-export:
    post:
      tags:
      - Privacy, Consent & Data Rights
      summary: Request Data Export
      description: Generates a structured, machine-readable JSON data archive of all
        candidate information.
      operationId: request_data_export_api_v1_candidate_data_export_post
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_DataExportResponse_'
      security:
      - HTTPBearer: []
  /api/v1/candidate/data-export/{export_id}/download:
    get:
      tags:
      - Privacy, Consent & Data Rights
      summary: Download Data Export
      description: Downloads the candidate's exported data payload with strict ownership
        verification.
      operationId: download_data_export_api_v1_candidate_data_export__export_id__download_get
      security:
      - HTTPBearer: []
      parameters:
      - name: export_id
        in: path
        required: true
        schema:
          type: string
          title: Export Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_DataExportDownloadResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/candidate/account-deletion:
    post:
      tags:
      - Privacy, Consent & Data Rights
      summary: Request Account Deletion
      description: Initiates account deletion workflow, revokes sessions, and coordinates
        satellite deletion.
      operationId: request_account_deletion_api_v1_candidate_account_deletion_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_AccountDeletionResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/candidate/account-deletion/status:
    get:
      tags:
      - Privacy, Consent & Data Rights
      summary: Get Account Deletion Status
      description: Retrieves current deletion workflow status.
      operationId: get_account_deletion_status_api_v1_candidate_account_deletion_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_Union_AccountDeletionResponse__NoneType__'
      security:
      - HTTPBearer: []
  /api/v1/resumes:
    get:
      tags:
      - Resume Intelligence
      summary: List Resumes
      description: Lists all resume containers owned by the candidate.
      operationId: list_resumes_api_v1_resumes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ResumeSummaryResponse'
                type: array
                title: Response List Resumes Api V1 Resumes Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - Resume Intelligence
      summary: Upload Resume
      description: Securely uploads an initial resume document (PDF or DOCX).
      operationId: upload_resume_api_v1_resumes_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_resume_api_v1_resumes_post'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeUploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/resumes/{resume_id}:
    get:
      tags:
      - Resume Intelligence
      summary: Get Resume
      description: Retrieves resume summary and active version details.
      operationId: get_resume_api_v1_resumes__resume_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: resume_id
        in: path
        required: true
        schema:
          type: string
          title: Resume Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeSummaryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Resume Intelligence
      summary: Delete Resume
      description: Permanently deletes a resume, all versions, extraction data, and
        stored files.
      operationId: delete_resume_api_v1_resumes__resume_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: resume_id
        in: path
        required: true
        schema:
          type: string
          title: Resume Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/resumes/{resume_id}/versions:
    post:
      tags:
      - Resume Intelligence
      summary: Upload New Version
      description: Uploads an additional version to an existing candidate resume.
      operationId: upload_new_version_api_v1_resumes__resume_id__versions_post
      security:
      - HTTPBearer: []
      parameters:
      - name: resume_id
        in: path
        required: true
        schema:
          type: string
          title: Resume Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_new_version_api_v1_resumes__resume_id__versions_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeUploadResponse'
        '422':
          description: Validation Error
